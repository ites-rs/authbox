[package]
name = "authbox-core"
version = "1.2.4"
edition = "2024"
description = "Core authentication traits and types for AuthBox"
license = "Apache-2.0"
repository = "https://github.com/anomalous254/authbox"
readme = "../../README.md"
keywords = ["auth", "jwt", "security"]
categories = ["authentication", "web-programming"]
authors = ["anomalous254"]


[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1.89"
uuid = {version="1.23.1", features=["v4"]}
tracing = "0.1.44"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
metrics = "0.24"

[dev-dependencies]
metrics-util = "0.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }



[package]
name = "authbox-redis"
version = "3.0.0"
edition = "2024"
description = "Redis-backed implementations for AuthBox one-time tokens and token blacklisting"
license = "Apache-2.0"
repository = "https://github.com/anomalous254/authbox"
readme = "../../README.md"
authors = ["anomalous254"]

[dependencies]
authbox-core = "3.0.0"
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
async-trait = "0.1.89"
chrono = "0.4.44"

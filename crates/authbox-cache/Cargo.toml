[package]
name = "authbox-cache"
version = "3.0.0"
edition = "2024"
description = "In-memory user cache (moka) for AuthBox"
license = "Apache-2.0"
repository = "https://github.com/anomalous254/authbox"
readme = "../../README.md"
authors = ["anomalous254"]

[dependencies]
authbox-core = "3.0.0"
async-trait = "0.1.89"
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"